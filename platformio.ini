; ESP32 Home Controller
; Board: ESP32 classic (DevKit / WROOM / Wemos LOLIN32 / clone). 4 MB flash.
; Framework: Arduino-ESP32 3.x via pioarduino (official espressif32 platform is still Arduino 2.x).

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
lib_compat_mode = strict
lib_ldf_mode = chain
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
  -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64

[env:esp32dev]
; pinned pioarduino release 55.03.312 (Arduino-ESP32 3.3.11, IDF 5.5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
custom_sdkconfig = file://sdkconfig.custom
lib_deps =
  h2zero/NimBLE-Arduino @ ^2.5.1
  ESP32Async/AsyncTCP @ ^3.6.1
  ESP32Async/ESPAsyncWebServer @ ^3.12.1
  bblanchon/ArduinoJson @ ^7.4.3
  adafruit/DHT sensor library
  milesburton/DallasTemperature @ ^3.11.0
  paulstoffregen/OneWire @ ^2.3.8
