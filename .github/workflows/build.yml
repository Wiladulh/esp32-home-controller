name: build-firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio esptool

      - name: Pin pioarduino Core for custom_sdkconfig
        run: |
          printf 'pioarduino==6.2.0\n' > "$RUNNER_TEMP/uv-constraints.txt"
          echo "UV_CONSTRAINT=$RUNNER_TEMP/uv-constraints.txt" >> "$GITHUB_ENV"

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Verify generated ESP-IDF configuration
        run: |
          test -f sdkconfig.esp32dev
          grep -qx 'CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y' sdkconfig.esp32dev
          grep -qx 'CONFIG_ESP_COREDUMP_STACK_SIZE=1792' sdkconfig.esp32dev
          grep -qx 'CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y' sdkconfig.esp32dev
          grep -qx 'CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y' sdkconfig.esp32dev
          grep -qx 'CONFIG_MQTT_TRANSPORT_SSL=y' sdkconfig.esp32dev
          grep -qx 'CONFIG_MQTT_TRANSPORT_WEBSOCKET=y' sdkconfig.esp32dev
          grep -qx 'CONFIG_MQTT_TRANSPORT_WEBSOCKET_SECURE=y' sdkconfig.esp32dev

      - name: Build LittleFS (WebUI)
        run: pio run -e esp32dev -t buildfs

      - name: Check inline WebUI JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("data/index.html").read_text(encoding="utf-8")
          scripts = [
              match.group(1)
              for match in re.finditer(r"<script\\b[^>]*>([\\s\\S]*?)</script\\s*>", html, re.IGNORECASE)
              if match.group(1).strip()
          ]
          if not scripts:
              raise SystemExit("No inline JavaScript found in data/index.html")
          Path("/tmp/webui-inline-check.mjs").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/webui-inline-check.mjs

      - name: Merge into one flash image (4 MB)
        run: |
          B=.pio/build/esp32dev
          python -m esptool --chip esp32 merge-bin \\
            -o full-flash-4MB.bin --flash-mode dio --flash-size 4MB \\
            0x1000  $B/bootloader.bin \\
            0x8000  $B/partitions.bin \\
            0x10000 $B/firmware.bin \\
            0x310000 $B/littlefs.bin
          cp $B/firmware.bin firmware-app-only.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-home-controller
          if-no-files-found: error
          path: |
            full-flash-4MB.bin
            firmware-app-only.bin
